plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.11'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.epages.restdocs-api-spec' version '0.19.4'   // 추가
}

group = 'org.example'
version = '0.0.1-SNAPSHOT'
description = '8th-BE'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.0'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.h2database:h2'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
    testImplementation 'com.epages:restdocs-api-spec-mockmvc:0.19.4'
}

tasks.named('test') {
    useJUnitPlatform()
}



// 추가: openapi3 명세 생성 설정
openapi3 {
    servers = [ { url = 'http://localhost:8080' } ]
    title = '8th-BE API'
    description = '8th-BE API 명세'
    version = '0.0.1'
    format = 'yaml'
    outputDirectory = 'build/resources/main/static/docs'
}

tasks.matching { it.name == 'openapi3' }.configureEach {
    dependsOn 'test'
    doFirst {
        file('build/resources/main/static/docs').mkdirs()
    }
    doLast {
        def f = file('build/resources/main/static/docs/openapi3.yaml')
        def text = f.getText('UTF-8')
        text = text.replaceAll(/(?m)^(\s+)("?)([A-Za-z0-9_\-]+)__[^":\r\n]*\2:\s*$/, '$1$2$3$2:')
        f.setText(text, 'UTF-8')
    }
}